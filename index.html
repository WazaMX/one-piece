                        <button class="descripcion-autor" type="button" aria-expanded="false" aria-controls="carrusel-autor">
                            Eiichirō Oda, nacido en Kumamoto en 1975, es un célebre mangaka mundialmente conocido por crear One Piece (1997-presente), la obra con la que ha superado los 600 millones de copias vendidas y obtenido un Récord Guinness como el manga con mayor cantidad de ejemplares publicados por un único autor. Tras formarse como asistente de reconocidos artistas y destacar a temprana edad con obras como Wanted, Oda construyó un imperio creativo fuertemente inspirado en su pasión infantil por los piratas y en el estilo de Akira Toriyama. Casado con la exmodelo Chiaki Inaba y padre de dos hijas, divide su tiempo entre su residencia-estudio en Tokio y su fuerte compromiso con su ciudad natal a la que ayudó económicamente tras los terremotos de 2016 y donde se ha honrado su legado con estatuas de Monkey D. Luffy, consolidándose además como una de las mentes más influyentes de la era actual según la Universidad de Tokio.

        <script>
            function configurarCarrusel(selectorDescripcion, selectorCarrusel) {
                const descripcion = document.querySelector(selectorDescripcion);
                const carrusel = document.querySelector(selectorCarrusel);
                const diapositivas = Array.from(carrusel.querySelectorAll('.diapositiva'));
                const indicadores = carrusel.querySelector('.indicadores');
                const anterior = carrusel.querySelector('.anterior');
                const siguiente = carrusel.querySelector('.siguiente');
                let diapositivaActual = 0;

                function mostrarDiapositiva(indice) {
                    diapositivaActual = (indice + diapositivas.length) % diapositivas.length;
                    diapositivas.forEach((diapositiva, posicion) => {
                        diapositiva.classList.toggle('activa', posicion === diapositivaActual);
                    });
                    indicadores.querySelectorAll('.indicador').forEach((indicador, posicion) => {
                        indicador.classList.toggle('activo', posicion === diapositivaActual);
                        indicador.setAttribute('aria-current', posicion === diapositivaActual ? 'true' : 'false');
                    });
                }

                diapositivas.forEach((_, indice) => {
                    const indicador = document.createElement('button');
                    indicador.className = 'indicador';
                    indicador.type = 'button';
                    indicador.setAttribute('aria-label', `Mostrar imagen ${indice + 1}`);
                    indicador.addEventListener('click', () => mostrarDiapositiva(indice));
                    indicadores.appendChild(indicador);
                });

                descripcion.addEventListener('click', () => {
                    const estaAbierto = descripcion.getAttribute('aria-expanded') === 'true';
                    descripcion.setAttribute('aria-expanded', String(!estaAbierto));
                    carrusel.hidden = estaAbierto;
                });

                anterior.addEventListener('click', () => mostrarDiapositiva(diapositivaActual - 1));
                siguiente.addEventListener('click', () => mostrarDiapositiva(diapositivaActual + 1));
                mostrarDiapositiva(0);
            }

            configurarCarrusel('.descripcion-autor', '#carrusel-autor');
            configurarCarrusel('.descripcion-carrusel', '#carrusel-momentos');
            configurarCarrusel('.descripcion-referencias', '#carrusel-referencias');
            configurarCarrusel('.descripcion-homenajes', '#carrusel-homenajes');
            configurarCarrusel('.descripcion-frutas', '#carrusel-frutas');

            const menuToggle = document.querySelector('.menu-toggle');
            const menuNavegacion = document.querySelector('#menu-navegacion');
            menuToggle.addEventListener('click', () => {
                const estaAbierto = menuToggle.getAttribute('aria-expanded') === 'true';
                menuToggle.setAttribute('aria-expanded', String(!estaAbierto));
                document.querySelector('.sidebar').classList.toggle('sidebar-cerrado', estaAbierto);
            });

            const authorToggle = document.querySelector('.author-toggle');
            const authorContent = document.querySelector('#autor-contenido');
            authorToggle.addEventListener('click', () => {
                const estaAbierto = authorToggle.getAttribute('aria-expanded') === 'true';
                authorToggle.setAttribute('aria-expanded', String(!estaAbierto));
                document.querySelector('#autor').classList.toggle('autor-cerrado', estaAbierto);
            });
        </script>
